constraints:
  claims_policy: >
    Aucun chiffre de résultat client : c'est la première cohorte, aucun
    participant n'a encore de résultat. Aucune promesse de revenus. Les
    chiffres autorisés sont ceux de constraints.proof, sur le travail de
    WebModerne lui-même. Ne jamais dire que la méthode supprime tous les bugs.
  proof:
    - "une tâche confiée à un agent chez WebModerne a renvoyé « succeeded », code de sortie 0, sans avoir rien fait"
    - "un service en double de notre passerelle Telegram a redémarré en boucle au moins 453 fois pendant que la vraie passerelle répondait normalement ; la cause était un service en double, pas un bug de code"
    - "un premier agent vierge, lancé à l'aveugle sur notre outil copy-funnel, a trouvé les 6 pièges que nous avions cachés dans le brief de test"
    - "11 textes marketing, chacun validé par sa propre vérification, contenaient 7 contradictions une fois lus ensemble"
    - "l'outil copy-funnel est passé par 3 tours de test à l'aveugle avant d'être livré"
  testimonials: []

