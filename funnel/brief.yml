author:
  name: Karnon Koné
  title: co-fondateur de WebModerne
  company: WebModerne
  one_liner: nous aidons les non-techniciens à construire des applications avec l'IA
  background: >
    WebModerne fait tourner son activité avec des agents IA : le blog, les
    vidéos, l'assistant sur Telegram, la publication. Un jour, une tâche
    confiée à un agent revient avec le statut « succeeded », code de sortie 0.
    Tout est vert. L'agent n'avait rien fait : il avait démarré, n'avait reçu
    aucune consigne et s'était arrêté. Ce jour-là, nous avons arrêté de croire
    les statuts. Depuis, chaque chose que nos agents construisent passe devant
    un second agent qui n'a rien vu de la construction et qui vérifie contre
    des critères écrits à l'avance. C'est le test à l'aveugle.
  mission: que les non-techniciens livrent du logiciel aussi fiable que celui des équipes techniques
  platforms:
    - Facebook WebModerne
    - YouTube WebModerne
  contact:
    url: https://blog.webmoderne.com

