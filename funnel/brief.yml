# Brief de l'offre « Construire Fiable » (WebModerne).
# Langue de sortie : français. Persona WebModerne : « nous », jamais « on ».
meta:
  name: construire-fiable
  updated: 2026-10-22

topic:
  focus: agents de code fiables
  focus_alt: construire un logiciel avec l'IA sans savoir coder

audience:
  singular: entrepreneur non technique
  plural: entrepreneurs non techniques
  aspirational: bâtisseur qui livre du logiciel fiable
  aspirational_plural: bâtisseurs qui livrent du logiciel fiable
  type: solopreneur, indépendant ou responsable métier qui construit ses propres outils avec Claude Code, Cursor, Lovable ou Bolt
  questions:
    - Comment savoir si l'agent a vraiment corrigé le bug ?
    - Pourquoi chaque correction casse autre chose ?
    - Est-ce que je peux mettre cette application entre les mains de vrais clients ?
  vocabulary:
    - "« corrige ça » en boucle"
    - "une appli qui marche à 75 %"
    - "il corrige une chose et en casse dix"
    - "l'agent m'a dit que c'était fait"
    - "jouer au tape-taupe avec mes bugs"
    - "l'appli ne marche pas"

action:
  primary: vérifier ce que l'agent a vraiment fait avant de lui faire confiance
  secondary:
    - écrire ce que « terminé » veut dire avant de lancer l'agent
    - faire relire le travail par un second agent qui n'a rien vu

outcome:
  payoff: livrer un logiciel qui fonctionne vraiment, construit avec un agent de code
  supporting:
    - arrêter de croire l'agent sur parole
    - savoir à tout moment ce qui est prouvé et ce qui ne l'est pas
  emotional: la tranquillité de cliquer sur « publier » sans croiser les doigts

desire:
  top: livrer un logiciel fiable sans devenir développeur
  others:
    - ne plus dépendre d'un développeur pour savoir si ça marche
    - montrer son outil à des clients sans peur qu'il casse
  emotion: confiant

pain:
  top: croire l'agent quand il dit « terminé »
  problems:
    - l'agent annonce une correction qui n'a pas eu lieu
    - chaque correction casse une autre partie de l'application
    - impossible de savoir, sans lire le code, ce qui marche vraiment
  frustrations:
    - des heures à écrire « corrige ça » au même agent
    - une application bloquée à 75 % depuis des semaines
  roadblock: penser que le problème vient du choix de l'outil ou du modèle
  roadblocks:
    - demander à l'agent de vérifier son propre travail
    - aucune définition écrite de « terminé » avant de commencer
  roadblock_why: un agent qui relit son propre travail valide ses propres erreurs
  false_belief: il faudrait apprendre à coder pour savoir si ça marche
  fears:
    - lancer devant des clients une application qui casse
    - avoir payé des abonnements et des heures pour un projet inutilisable

benefits:
  - aucune ligne de code à lire pour vérifier un résultat
  - fonctionne avec Claude Code, Cursor, Codex, Lovable ou Bolt
  - une méthode qui se répète à chaque fonctionnalité

enemy: la confiance aveugle dans le « terminé » de l'agent
enemies: les promesses du « une application en 5 minutes »

